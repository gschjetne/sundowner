name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # europa (the default) and silk, which adds the Hebrew, Armenian
        # and CJK fonts.
        features: ["", "silk"]
    name: check (${{ matrix.features || 'europa' }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --features "${{ matrix.features }}" -- -D warnings
      - name: Test (including stress tests)
        run: cargo test --release --features "${{ matrix.features }}" -- --include-ignored
      - name: Static build
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --features "${{ matrix.features }}"
          file target/x86_64-unknown-linux-musl/release/sundowner
          ls -l target/x86_64-unknown-linux-musl/release/sundowner

  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundled fonts match their checksums
        run: cd fonts && sha256sum -c SHA256SUMS

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87
      - run: cargo test
      - run: cargo test --features silk
