[package]
name = "sundowner"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Fast, dependency-free Markdown to PDF converter"
license = "MIT AND OFL-1.1 AND Unicode-3.0"

[features]
# The silk tier adds Hebrew, Armenian, Chinese, Japanese and Korean fonts.
silk = []

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Keep unwinding so an unexpected internal bug is caught and reported per file
# instead of aborting the whole process.
panic = "unwind"

# build.rs compresses the silk fonts; unoptimized, that takes a while.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
